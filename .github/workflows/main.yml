name: Opam bundle

on:
  pull_request:
  push:
    branches:
      - 'master'

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        os:
          - ubuntu-latest
        ocaml-compiler:
          - 4.08.x
          - 4.09.x
          - 4.10.x
          - 4.11.x
          - 4.12.x
          - 4.13.x
          - 4.14.x
          - 5.1.x
          - 5.2.x
          - 5.3.x
          - 5.4.x

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Use OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v2
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      - run: opam install . --deps-only --with-test
      - run: opam exec -- make
      - run: opam exec -- make stub-tests
      - run: opam exec -- make real-tests
        if: matrix.ocaml-compiler == '4.14.x' || matrix.ocaml-compiler == '5.4.x'
